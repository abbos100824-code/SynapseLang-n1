name: Build SynapseLang APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile SynapseLang Rust Core to WASM
        run: |
          rustup target add wasm32-unknown-unknown
          sed -i 's/wasm-bindgen = "0.2"/wasm-bindgen = "=0.2.92"/' Cargo.toml
          cargo update -p wasm-bindgen --precise 0.2.92
          cargo build --target wasm32-unknown-unknown --release
          curl -L https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.92/wasm-bindgen-0.2.92-x86_64-unknown-linux-musl.tar.gz | tar -xz
          ./wasm-bindgen-0.2.92-x86_64-unknown-linux-musl/wasm-bindgen target/wasm32-unknown-unknown/release/synapselang_core.wasm --out-dir www/pkg --target web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Project & Build APK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          mkdir -p android_apk/app/src/main/java/com/synapselang/poc
          mkdir -p android_apk/app/src/main/assets
          cp -r www/* android_apk/app/src/main/assets/
          cd android_apk

          printf 'rootProject.name = "SynapseLangPoC"\ninclude ":app"\n' > settings.gradle

          cat << 'EOG' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOG

          cat << 'EOG' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.synapselang.poc'
              compileSdk 34
              defaultConfig {
                  applicationId "com.synapselang.poc"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "0.1-PoC"
              }
              buildTypes { debug { debuggable true } }
          }
          dependencies {}
          EOG

          cat << 'EOG' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="SynapseLang IDE" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOG

          cat << 'EOG' > app/src/main/java/com/synapselang/poc/MainActivity.java
          package com.synapselang.poc;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOG

          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip
          unzip -q gradle.zip
          ./gradle-8.2/bin/gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SynapseLang_PoC.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynapseLang_PoC_APK
          path: SynapseLang_PoC.apk
