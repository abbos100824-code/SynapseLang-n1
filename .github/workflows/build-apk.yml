name: Build SynapseLang APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile SynapseLang Rust Core to WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --release
          WB_VER=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WB_VER}/wasm-bindgen-${WB_VER}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          ./wasm-bindgen-${WB_VER}-x86_64-unknown-linux-musl/wasm-bindgen target/wasm32-unknown-unknown/release/synapselang_core.wasm --out-dir www/pkg --target web
          echo "window.__WASM_B64__ = '$(base64 -w 0 www/pkg/synapselang_core_bg.wasm)';" > www/wasm_b64.js
          sed -i 's|<script src="app.js">|<script src="wasm_b64.js"></script><script src="app.js">|' www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Direct Android APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls $ANDROID_HOME/platforms/*/android.jar | sort -V | tail -n 1)

          mkdir -p apk_build/src/com/synapselang/poc apk_build/assets apk_build/obj
          cp -r www/* apk_build/assets/

          echo '<?xml version="1.0" encoding="utf-8"?>' > apk_build/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.synapselang.poc" android:versionCode="1" android:versionName="0.1">' >> apk_build/AndroidManifest.xml
          echo '  <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />' >> apk_build/AndroidManifest.xml
          echo '  <uses-permission android:name="android.permission.INTERNET" />' >> apk_build/AndroidManifest.xml
          echo '  <application android:label="SynapseLang IDE" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">' >> apk_build/AndroidManifest.xml
          echo '    <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">' >> apk_build/AndroidManifest.xml
          echo '      <intent-filter>' >> apk_build/AndroidManifest.xml
          echo '        <action android:name="android.intent.action.MAIN" />' >> apk_build/AndroidManifest.xml
          echo '        <category android:name="android.intent.category.LAUNCHER" />' >> apk_build/AndroidManifest.xml
          echo '      </intent-filter>' >> apk_build/AndroidManifest.xml
          echo '    </activity>' >> apk_build/AndroidManifest.xml
          echo '  </application>' >> apk_build/AndroidManifest.xml
          echo '</manifest>' >> apk_build/AndroidManifest.xml

          echo 'package com.synapselang.poc;' > apk_build/src/com/synapselang/poc/MainActivity.java
          echo 'import android.app.Activity;' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo 'import android.os.Bundle;' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo 'import android.webkit.*;' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo 'public class MainActivity extends Activity {' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '  @Override protected void onCreate(Bundle b) {' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    super.onCreate(b);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    WebView w = new WebView(this);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    WebSettings s = w.getSettings();' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    s.setJavaScriptEnabled(true);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    s.setDomStorageEnabled(true);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    s.setAllowFileAccess(true);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    s.setAllowFileAccessFromFileURLs(true);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    s.setAllowUniversalAccessFromFileURLs(true);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    w.setWebViewClient(new WebViewClient());' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    w.setWebChromeClient(new WebChromeClient());' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    setContentView(w);' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '    w.loadUrl("file:///android_asset/index.html");' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '  }' >> apk_build/src/com/synapselang/poc/MainActivity.java
          echo '}' >> apk_build/src/com/synapselang/poc/MainActivity.java

          $BUILD_TOOLS/aapt2 link -o apk_build/unsigned.apk --manifest apk_build/AndroidManifest.xml -I "$PLATFORM" -A apk_build/assets --java apk_build/src
          javac -source 8 -target 8 -classpath "$PLATFORM" -d apk_build/obj apk_build/src/com/synapselang/poc/*.java
          $BUILD_TOOLS/d8 apk_build/obj/com/synapselang/poc/*.class --lib "$PLATFORM" --output apk_build/
          cd apk_build && zip -q unsigned.apk classes.dex && cd ..
          $BUILD_TOOLS/zipalign -p -f 4 apk_build/unsigned.apk apk_build/aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SynapseLang,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out SynapseLang_PoC.apk apk_build/aligned.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynapseLang_PoC_APK
          path: SynapseLang_PoC.apk
