name: Build SynapseLang APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust & WASM Target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli

      - name: Compile SynapseLang Rust Core to WASM
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen target/wasm32-unknown-unknown/release/synapselang_core.wasm --out-dir www/pkg --target web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Wrapper & Build APK
        run: |
          mkdir -p android_apk/app/src/main/java/com/synapselang/poc
          mkdir -p android_apk/app/src/main/assets
          cp -r www/* android_apk/app/src/main/assets/
          cd android_apk

          cat << 'EOG' > settings.gradle
          rootProject.name = "SynapseLangPoC"
          include ':app'
          EOG

          cat << 'EOG' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOG

          cat << 'EOG' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.synapselang.poc'
              compileSdk 34
              defaultConfig {
                  applicationId "com.synapselang.poc"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "0.1-PoC"
              }
              buildTypes { debug { debuggable true } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
          EOG

          cat << 'EOG' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="SynapseLang IDE" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOG

          cat << 'EOG' > app/src/main/java/com/synapselang/poc/MainActivity.java
          package com.synapselang.poc;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return assetLoader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
          }
          EOG

          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SynapseLang_PoC.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynapseLang_PoC_APK
          path: SynapseLang_PoC.apk
