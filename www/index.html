<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SynapseLang IDE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --bg:#0b0f19; --panel:#111827; --border:#1f2937; --accent:#00f0ff; --text:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  .logo { font-weight:800; font-size:15px; color:var(--accent); }
  .badge { font-size:10px; background:#064e3b; color:#34d399; padding:2px 6px; border-radius:4px; }
  .run-btn { background:#00f0ff; color:#000; border:none; padding:8px 16px; border-radius:6px; font-weight:800; }
  .view { display:none; flex:1; flex-direction:column; overflow:hidden; position:relative; }
  .view.active { display:flex; }
  .toolbar, .quick-keys { background:#0f172a; padding:7px; display:flex; gap:6px; overflow-x:auto; border-bottom:1px solid var(--border); }
  .chip, .qkey { background:#1e293b; color:#38bdf8; border:1px solid #334155; padding:5px 10px; border-radius:6px; font-size:11px; white-space:nowrap; }
  #editor { flex:1; width:100%; background:var(--bg); color:#a5f3fc; font-family:monospace; font-size:14px; padding:12px; border:none; outline:none; resize:none; }
  #terminal-out { flex:1; background:#05080f; color:#10b981; font-family:monospace; font-size:12.5px; padding:12px; overflow-y:auto; white-space:pre-wrap; }
  .term-bar { display:flex; background:var(--panel); padding:8px; gap:8px; }
  .term-bar input { flex:1; background:#0b0f19; border:1px solid var(--border); color:#fff; padding:8px; border-radius:4px; }
  .term-bar button { background:#10b981; color:#000; border:none; padding:0 14px; border-radius:4px; font-weight:bold; }
  #canvas-container { flex:1; width:100%; height:100%; background:#070a12; }
  .hud { position:absolute; top:12px; left:12px; background:rgba(17,24,39,0.85); padding:8px 12px; border-radius:8px; font-size:11px; pointer-events:none; }
  .hud-btns { position:absolute; bottom:16px; right:16px; display:flex; gap:8px; }
  .hud-btn { background:rgba(0,240,255,0.15); border:1px solid var(--accent); color:var(--accent); padding:8px 12px; border-radius:8px; font-size:12px; font-weight:bold; }
  nav { background:var(--panel); border-top:1px solid var(--border); display:flex; height:54px; }
  .nav-btn { flex:1; background:none; border:none; color:#9ca3af; font-size:12px; font-weight:600; }
  .nav-btn.active { color:var(--accent); border-top:2px solid var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">⚡ SynapseLang <span class="badge" id="engine-status">Rust Core</span></div>
  <button class="run-btn" onclick="executeCode(true)">▶ RUN</button>
</header>
<div id="view-editor" class="view active">
  <div class="toolbar">
    <button class="chip" onclick="loadTemplate('boss_team')">🧠 1. Boss & Team</button>
    <button class="chip" onclick="loadTemplate('neural_net')">🕸️ 2. Neyron Qatlam</button>
    <button class="chip" onclick="loadTemplate('oscillator')">🔄 3. Siklik Ong</button>
    <button class="chip" onclick="newCustomFile()">➕ Yangi (.syn)</button>
  </div>
  <div class="quick-keys">
    <button class="qkey" onclick="insertText('node ')">node</button>
    <button class="qkey" onclick="insertText('synapse ')">synapse</button>
    <button class="qkey" onclick="insertText(' -> ')">-&gt;</button>
    <button class="qkey" onclick="insertText('[type=worker, op=scale, factor=1.5]')">[attrs]</button>
    <button class="qkey" onclick="insertText('[weight=0.8]')">[weight]</button>
    <button class="qkey" onclick="insertText('pulse Boss 5.0\n')">pulse</button>
    <button class="qkey" onclick="insertText('run 3\n')">run</button>
  </div>
  <textarea id="editor" spellcheck="false"></textarea>
</div>
<div id="view-terminal" class="view">
  <div id="terminal-out">SynapseLang Terminal tayyor...</div>
  <div class="term-bar">
    <input type="text" id="term-cmd" placeholder="Masalan: pulse Boss 10 yoki run 2" />
    <button onclick="runTerminalCmd()">Yuborish</button>
  </div>
</div>
<div id="view-3d" class="view">
  <div id="canvas-container"></div>
  <div class="hud"><div id="hud-stats">Tugunlar: 0 | Sinapslar: 0</div></div>
  <div class="hud-btns">
    <button class="hud-btn" onclick="stepFrom3D()">⚡ +1 Impuls</button>
    <button class="hud-btn" id="auto-btn" onclick="toggleAutoPulse()">🔄 Jonli</button>
  </div>
</div>
<nav>
  <button class="nav-btn active" onclick="switchTab('editor', this)">📝 Editor</button>
  <button class="nav-btn" onclick="switchTab('terminal', this)">💻 Terminal</button>
  <button class="nav-btn" onclick="switchTab('3d', this)">🌐 3D Ong</button>
</nav>
<script type="module">
  import init, { run_synapse_script } from './pkg/synapselang_core.js';
  init().then(() => {
    window.rustExecute = (c) => JSON.parse(run_synapse_script(c));
    document.getElementById('engine-status').innerText = 'Rust WASM';
    executeCode(false);
  }).catch(() => {});
</script>
<script src="app.js"></script>
</body>
</html>
